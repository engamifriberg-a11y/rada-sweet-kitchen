<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>אין חיבור</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FBF4FA;
    --surface: #FFFFFF;
    --line: #EADDF0;
    --ink: #3A2748;
    --muted: #7A6689;
    --accent: #8B3FC4;
    --accent-soft: #F3E6FA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17101F;
      --surface: #211830;
      --line: #342842;
      --ink: #F2EAF8;
      --muted: #A594B5;
      --accent: #C58CEA;
      --accent-soft: #2C1F3C;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 26px; padding: 32px 24px; max-width: 360px; width: 100%;
    text-align: center; box-shadow: 0 18px 40px rgba(58, 39, 72, .10);
  }
  .mark {
    width: 64px; height: 64px; border-radius: 22px; margin: 0 auto 18px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
  }
  h1 { font-size: 20px; margin: 0 0 10px; letter-spacing: -.3px; }
  p { font-size: 14px; line-height: 1.7; color: var(--muted); margin: 0 0 22px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    width: 100%; padding: 13px 18px; border: 0; border-radius: 15px;
    background: linear-gradient(135deg, #B14FC8, #7A33B8); color: #fff;
  }
  button:active { transform: scale(.98); }
  ul { text-align: start; font-size: 13.5px; color: var(--muted); line-height: 1.9; margin: 0 0 22px; padding-inline-start: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.4 19.6v-4.4c0-1.8 3.4-3.2 7.6-3.2s7.6 1.4 7.6 3.2v4.4Z" />
        <path d="M4.4 16.6c1.4 1.3 2.7-.8 4-.1 1.3.7 2.4 1.1 3.6.1 1.2-1 2.4-.5 3.6.1 1.2.6 2.5-1.4 4-.1" />
        <path d="M12 10V7.4" />
        <circle cx="12" cy="5.4" r="1.6" />
      </svg>
    </div>
    <h1>אין חיבור לאינטרנט</h1>
    <p>המטבח המתוק של ראדה צריך רשת כדי לטעון את המתכונים.</p>
    <ul>
      <li>בדקי שה־Wi‑Fi או הנתונים הסלולריים דלוקים.</li>
      <li>אם את במצב טיסה — כבי אותו.</li>
      <li>לפעמים מספיק להתרחק קצת ולנסות שוב.</li>
    </ul>
    <button onclick="retry()">נסי שוב</button>
  </div>
<script>
  function retry() {
    try {
      if (window.RadaNative && window.RadaNative.retry) {
        window.RadaNative.retry();
        return;
      }
    } catch (e) {}
    location.reload();
  }
</script>
</body>
</html>
