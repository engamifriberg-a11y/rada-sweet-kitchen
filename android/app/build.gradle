plugins {
    id 'com.android.application'
}

android {
    namespace 'com.radafriberg.kitchen'
    compileSdk 34

    defaultConfig {
        applicationId "com.radafriberg.kitchen"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    /*
     * חתימה. המפתח לא נמצא במאגר — המאגר ציבורי, ומפתח חתימה שדלף
     * מאפשר לכל אחד לפרסם עדכון מזויף לאפליקציה.
     *
     * הנתיב והסיסמאות מגיעים מ־keystore.properties מקומי (שאינו במאגר)
     * או ממשתני סביבה, ואם אין אף אחד מהם הבנייה פשוט יוצאת ללא חתימה
     * במקום להיכשל.
     */
    signingConfigs {
        release {
            def props = new Properties()
            def file = rootProject.file('keystore.properties')
            if (file.exists()) {
                file.withInputStream { props.load(it) }
            }
            def path = props.getProperty('storeFile') ?: System.getenv('RADA_KEYSTORE')
            if (path) {
                storeFile rootProject.file(path)
                storePassword props.getProperty('storePassword') ?: System.getenv('RADA_STORE_PASSWORD')
                keyAlias props.getProperty('keyAlias') ?: System.getenv('RADA_KEY_ALIAS')
                keyPassword props.getProperty('keyPassword') ?: System.getenv('RADA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // ללא טשטוש קוד: האפליקציה היא מעטפת דקה, אין מה להגן עליו
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/*
 * androidx מושך kotlin-stdlib 1.8.22, ותלות ישנה יותר מושכת איתה את
 * kotlin-stdlib-jdk7 ו-jdk8 בגרסה 1.6.21. החל מגרסה 1.8 המחלקות של
 * jdk7/jdk8 נכנסו לתוך kotlin-stdlib עצמו, ולכן שתי הגרסאות יחד
 * משכפלות עשרות מחלקות ו-checkReleaseDuplicateClasses עוצר את הבנייה.
 *
 * יישור כולם לאותה גרסה פותר: בגרסאות החדשות jdk7 ו-jdk8 הן ארכיונים
 * ריקות שרק מצביעות על kotlin-stdlib, כך שאין מה לשכפל.
 */
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
